<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Highlight & Short Generator (No Bot)</title>
    <style>
        * {
            box-sizing: border-box;
            border-radius: 0 !important;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0a0a0a;
            color: #d4d4d4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #121212;
            border: 2px solid #333;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 8px 8px 0px #000;
        }
        h1 {
            color: #de9b35;
            margin-top: 0;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .section-title {
            font-size: 12px;
            color: #777;
            text-transform: uppercase;
            margin: 15px 0 5px 0;
            letter-spacing: 1px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #aaa;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }
        .dropzone {
            border: 2px dashed #444;
            padding: 25px;
            text-align: center;
            background-color: #161616;
            cursor: pointer;
            margin-bottom: 15px;
            color: #888;
        }
        .dropzone:hover {
            border-color: #de9b35;
            color: #fff;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .col {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #de9b35;
            color: #000;
            border: 2px solid #de9b35;
            font-size: 15px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #f0ad4e;
        }
        button:disabled {
            background-color: #333;
            border-color: #333;
            color: #666;
            cursor: not-allowed;
        }
        .status-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #161616;
            border: 1px dashed #555;
            font-size: 13px;
        }
        .error {
            border-color: #ff5555;
            color: #ff8080;
        }
        .output-box {
            display: none;
            margin-top: 20px;
            border: 1px solid #de9b35;
            padding: 20px;
            background-color: #18150f;
            text-align: center;
        }
        .stats-bar {
            background: #0d0d0d;
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #4ade80;
            text-align: left;
        }
        canvas {
            border: 1px solid #444;
            background: #000;
            max-width: 100%;
            margin-bottom: 15px;
        }
        .download-btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .download-btns button {
            margin-top: 0;
            background-color: #222;
            color: #de9b35;
            border: 1px solid #de9b35;
            font-size: 13px;
            padding: 10px;
        }
        .download-btns button:hover {
            background-color: #de9b35;
            color: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CS2 Highlight Generator (No Bot)</h1>
    
    <div class="section-title">1. Upload Match Replay (.dem)</div>
    <div class="dropzone" onclick="document.getElementById('demFile').click()">
        <span id="fileNameDisplay">📂 CLICK OR DROP CS2 .DEM FILE HERE</span>
        <input type="file" id="demFile" accept=".dem" style="display: none;" onchange="updateFileName(this)">
    </div>

    <div class="row">
        <div class="col">
            <label for="steamId">Player SteamID64 (Opt.)</label>
            <input type="text" id="steamId" placeholder="Leave blank for best MVP">
        </div>
        <div class="col">
            <label for="videoFormat">Format</label>
            <select id="videoFormat">
                <option value="169">Standard (16:9 YouTube)</option>
                <option value="916">Vertical Short (9:16 Shorts)</option>
            </select>
        </div>
    </div>

    <div class="section-title">2. Camera & Effects</div>
    <div class="row">
        <div class="col">
            <label for="fov">Camera FOV</label>
            <input type="number" id="fov" value="90" min="60" max="120">
        </div>
        <div class="col">
            <label for="viewmodelFov">Viewmodel FOV</label>
            <input type="number" id="viewmodelFov" value="68" min="54" max="68">
        </div>
    </div>

    <label for="overlayText">Text Overlay</label>
    <input type="text" id="overlayText" placeholder="INSANE CLUTCH">

    <button id="generateBtn" onclick="uploadAndParseDemo()">EXTRACT HIGHLIGHTS</button>

    <div id="statusBox" class="status-box"></div>

    <div id="outputBox" class="output-box">
        <div id="statsBar" class="stats-bar"></div>
        <canvas id="previewCanvas"></canvas>
        <div class="download-btns">
            <button id="dlConfigBtn">Download CS2 Auto-Camera Config (.cfg)</button>
            <button id="dlTitleCardBtn">Download Overlay Graphic (.png)</button>
        </div>
    </div>
</div>

<script>
    function updateFileName(input) {
        if (input.files.length > 0) {
            document.getElementById('fileNameDisplay').textContent = `✔ Selected: ${input.files[0].name}`;
        }
    }

    async function uploadAndParseDemo() {
        const fileInput = document.getElementById('demFile');
        const steamId = document.getElementById('steamId').value.trim();
        const videoFormat = document.getElementById('videoFormat').value;
        const fov = document.getElementById('fov').value;
        const viewmodelFov = document.getElementById('viewmodelFov').value;
        const overlayText = document.getElementById('overlayText').value.trim();

        const statusBox = document.getElementById('statusBox');
        const outputBox = document.getElementById('outputBox');
        const btn = document.getElementById('generateBtn');

        outputBox.style.display = 'none';
        statusBox.className = 'status-box';

        if (fileInput.files.length === 0) {
            statusBox.style.display = 'block';
            statusBox.classList.add('error');
            statusBox.innerHTML = '<strong>ERROR:</strong> Please select a .dem file first.';
            return;
        }

        const formData = new FormData();
        formData.append('dem', fileInput.files[0]);
        formData.append('steamId', steamId);
        formData.append('fov', fov);
        formData.append('viewmodelFov', viewmodelFov);
        formData.append('overlayText', overlayText);

        btn.disabled = true;
        statusBox.style.display = 'block';
        statusBox.innerHTML = `> Parsing demo ticks locally... (Fast processing)`;

        try {
            // Your backend endpoint that accepts file uploads and runs demoparser2
            const response = await fetch('http://localhost:3000/api/parse-demo', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Failed to parse demo.');

            document.getElementById('statsBar').innerHTML = `
                <strong>HIGHLIGHT FOUND:</strong><br>
                > PLAYER: ${data.highlight.player}<br>
                > ROUND: ${data.highlight.round} (${data.highlight.killsCount} KILLS)<br>
                > TICKS: ${data.highlight.startTick} -> ${data.highlight.endTick}
            `;

            renderOverlayCanvas(videoFormat, overlayText || `${data.highlight.player} - ${data.highlight.killsCount}K`, data.highlight.round);

            document.getElementById('dlConfigBtn').onclick = () => downloadTextFile('cs2_highlight.cfg', data.cfgContent);
            document.getElementById('dlTitleCardBtn').onclick = () => downloadCanvas();

            statusBox.style.display = 'none';
            outputBox.style.display = 'block';

        } catch (err) {
            statusBox.classList.add('error');
            statusBox.innerHTML = `<strong>ERROR:</strong> ${err.message}`;
        } finally {
            btn.disabled = false;
        }
    }

    function renderOverlayCanvas(format, text, round) {
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = format === '916' ? 270 : 480;
        canvas.height = format === '916' ? 480 : 270;

        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#de9b35';
        ctx.lineWidth = 4;
        ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

        ctx.fillStyle = '#de9b35';
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(`CS2 // ROUND ${round}`, canvas.width / 2, 45);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px Courier New';
        ctx.fillText(text.toUpperCase(), canvas.width / 2, canvas.height / 2);
    }

    function downloadTextFile(filename, text) {
        const el = document.createElement('a');
        el.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
        el.setAttribute('download', filename);
        el.click();
    }

    function downloadCanvas() {
        const link = document.createElement('a');
        link.download = 'cs2-overlay.png';
        link.href = document.getElementById('previewCanvas').toDataURL();
        link.click();
    }
</script>

</body>
</html>
